name: Sync brand

# On every push, copy the shared brand from _brand/ into each extension
# (tools/sync-brand.py), rebuild the Word and PowerPoint files (Quarto reference
# docs and office-templates/), and commit any changes back to the branch. Then
# render every starter to check nothing is broken.
# Pushes made with GITHUB_TOKEN don't trigger workflows, so this can't loop.

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-brand-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Regenerate brand files
        run: |
          pip install python-docx python-pptx
          python3 tools/sync-brand.py --office

      - name: Commit regenerated files
        # Pull requests (possibly from forks) can't be pushed to; the push to
        # the branch itself handles those.
        if: github.event_name != 'pull_request'
        run: |
          git add _extensions office-templates
          if git diff --cached --quiet; then
            echo "Brand files already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync brand files from _brand/"
          git pull --rebase
          git push

      - name: Render starter templates
        run: |
          quarto render website.qmd
          quarto render report.qmd
          quarto render presentation.qmd
          quarto render word.qmd
          quarto render powerpoint.qmd
          quarto render brief.qmd
