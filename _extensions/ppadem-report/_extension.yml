title: "PPADEM Report Theme"
author: "PPADEM Project"
version: "1.1.0"
quarto-required: ">=1.3.0"
contributes:
  formats:
    html:
      embed-resources: true
      theme: [yeti, ppadem-brand.scss, custom.scss]
      template-partials: [title-block.html]
      # Banner colours are set in custom.scss from the brand palette
      title-block-banner: true
      toc: true
      toc-depth: 2
      number-sections: true
      code-fold: true
      fig-cap-location: bottom
      tbl-cap-location: top
      crossref:
        fig-prefix: Figure
        tbl-prefix: Table
