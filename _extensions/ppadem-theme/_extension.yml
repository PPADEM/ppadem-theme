title: "PPADEM Website Theme"
author: "PPADEM Project"
version: "2.0.0"
quarto-required: ">=1.3.0"
contributes:
  formats:
    html:
      theme: [cosmo, ppadem-brand.scss]
      # Wider main column than Quarto's default 800px
      grid:
        body-width: 1250px
      toc: true
      toc-location: right
      smooth-scroll: true
      anchor-sections: true
      code-copy: true
      code-overflow: wrap
      link-external-icon: true
      link-external-newwindow: true
      filters: [ppadem-funding.lua]
